<!DOCTYPE html> 
<html lang="ja"> 
 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
  <title>名刺デザイン</title> 
 
  <link rel="stylesheet" href="style.css"> 
</head> 
 
<body> 
  <header class="site-header"> 
 
    <a class="site-logo" href="index.html"> 
      <span class="logo-mark">✿</span> 
      <span>MIKU TODA</span> 
    </a> 
 
    <nav class="global-nav"> 
      <a href="index.html">Home</a> 
      <a class="active" href="works.html">Works</a> 
      <a href="profile.html">Profile</a> 
    </nav> 
 
  </header> 
 
  <main class="page-shell"> 
 
    <a class="back-link" href="works.html"> 
      ← 作品一覧に戻る 
    </a> 
 
    <div class="detail-heading"> 
      <h1>猫カフェイメージ</h1> 
    </div> 
 
    <section class="detail-layout"> 

      <div class="card-slider"> 
 
        <img  
          id="businessCardImage" 
          src="images/business-card.png"  
          alt="名刺デザインの作品画像" 
        > 
 
        <button  
          id="rightArrow"  
          class="card-arrow"  
          onclick="toggleCard()"  
        >  
          ≫  
        </button>  
 
      </div> 
 
      <div class="detail-copy"> 
 
        <h2>作品について</h2> 
 
        <p> 
          猫カフェをイメージして制作しています。 
        </p> 

        <p> 
          見やすさと印象に残るデザインを意識して制作した 
          名刺デザインです。 
          文字の大きさや配置、色の組み合わせを工夫し、 
          必要な情報が分かりやすく伝わるようにしました。 
        </p> 
 
        <p> 
          シンプルな中にも自分らしさを感じられるように、 
          全体のバランスや余白を意識しながら制作しました。 
        </p> 
 
        <p class="tool-label"> 
          使用ツール：Illustrator 
        </p> 
 
      </div> 
 
    </section> 

  </main> 
 
  <footer class="site-footer"> 
    <p>© 2026 Miku Toda</p> 
  </footer> 

  <script> 
    let isFront = true; 
 
    function toggleCard() { 
      const image = document.getElementById("businessCardImage"); 
 
      if (isFront) { 
        image.src = "images/business-card-back.png"; 
        isFront = false; 
      } else { 
        image.src = "images/business-card.png"; 
        isFront = true; 
      } 
    } 
  </script> 
 
</body> 
</html>
