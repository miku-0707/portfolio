<!DOCTYPE html> 
<html lang="ja"> 

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ショップカード</title>
  <link rel="stylesheet" href="style.css">
</head> 

<body> 

<header class="site-header">
  <a class="site-logo" href="index.html">
    <span class="logo-mark">✿</span>
    <span>MIKU TODA</span>
  </a>

  <nav class="global-nav">
    <a href="index.html">Home</a>
    <a class="active" href="works.html">Works</a>
    <a href="profile.html">Profile</a>
  </nav>
</header> 

<main class="page-shell"> 

  <a class="back-link" href="works.html">
    ← 作品一覧に戻る
  </a> 

  <div class="detail-heading">
    <h1>猫カフェイメージショップカード</h1>
  </div> 

  <section class="detail-layout">
    
    <div class="card-slider"> 
     
      <img 
       id="shopCardImage"
       src="images/shop-card.png" 
       alt="ショップカードの作品画像">


      <button
      id="rightArrow"  
      class="card-arrow"
      onclick="toggleShopCard()"
    >
      ≫
    </button>

  </div>

    <div class="detail-copy">

      <h2>作品について</h2>

      <p>
        　猫カフェをイメージして制作したショップカードです。先に06と07をご覧ください。

      <p>
        　06と07に雰囲気を合わせて表と裏を制作しています。
      </p>

      <p class="tool-label">
        使用ツール：Illustrator
      </p>

    </div>

  </section> 

</main>

<footer class="site-footer">
  <p>© 2026 Miku Toda</p>
</footer> 

<script>
  let isShopFront = true;

  function toggleShopCard() {
    const image = document.getElementById("shopCardImage");

    if (isShopFront) {
      image.src = "images/shop-card-back.png";
      isShopFront = false;
    } else {
      image.src = "images/shop-card.png";
      isShopFront = true;
    }
  }
</script>

</body>

</html>
