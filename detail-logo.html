<section class="detail-layout"><img src="images/logo.png" alt="ロゴデザインの作品画像"><div class="detail-copy"><h2>作品について</h2><p>　猫カフェをイメージして書いたロゴです。空想の猫カフェの名前は「With Cat」です。翻訳すると「猫と共に」となります。</p><p>　猫とコーヒーカップを組み合わせることで、猫カフェで過ごす時間を視覚的に表現しました。また、「with」の文字にハートを組み合わせ、猫と一緒に過ごす温かさや親しみやすさを表現しました。</p><p class="tool-label">使用ツール：Illustrator</p></div></section>
